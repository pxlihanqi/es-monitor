<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ES Monitor Config Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="background-orb orb-a"></div>
    <div class="background-orb orb-b"></div>

    <main class="page-shell">
      <header class="topbar reveal">
        <div>
          <h1>ES Monitor Config Studio</h1>
          <p>支持表单编辑和原始 YAML/JSON 编辑，配置自动落盘到独立监控目录。</p>
        </div>
        <div class="actions">
          <button id="refreshBtn" class="ghost">刷新</button>
          <button id="saveAndReloadBtn" class="primary">保存并重新加载</button>
          <button id="createBtn" class="primary">新建监控</button>
        </div>
      </header>

      <section class="workspace reveal delay-1">
        <aside class="sidebar">
          <div class="panel-title-row">
            <h2>监控列表</h2>
            <span id="countBadge" class="badge">0</span>
          </div>
          <ul id="monitorList" class="monitor-list"></ul>
        </aside>

        <section class="editor-panel" id="editorPanel">
          <div class="panel-title-row">
            <h2 id="editorTitle">未选择监控</h2>
            <span id="status" class="status idle">Ready</span>
          </div>

          <div class="mode-title">表单编辑（monitor.yaml）</div>
          <div class="monitor-form-grid">
            <label class="field"><span>name</span><input id="f_name" type="text" /></label>
            <label class="field"><span>enabled</span><select id="f_enabled"><option value="true">true</option><option value="false">false</option></select></label>
            <label class="field"><span>schedule</span><input id="f_schedule" type="text" placeholder="*/5 * * * *" /></label>

            <label class="field"><span>es.node</span><input id="f_es_node" type="text" /></label>
            <label class="field"><span>es.username</span><input id="f_es_username" type="text" /></label>
            <label class="field"><span>es.password</span><input id="f_es_password" type="password" /></label>
            <label class="field"><span>es.index</span><input id="f_es_index" type="text" /></label>
            <label class="field field-wide"><span>es.kql（KQL 查询，优先级高于 queryFile 和 fuzzyConditions）</span><input id="f_es_kql" type="text" placeholder='status:200 and method:GET' /></label>
            <label class="field"><span>es.queryFile</span><input id="f_es_query_file" type="text" placeholder="./query.json" /></label>
            <label class="field field-wide"><span>es.fuzzyConditions（每行 field:value）</span><textarea id="f_es_fuzzy_conditions" placeholder="message:timeout&#10;service.keyword:nginx"></textarea></label>

            <label class="field"><span>time.field</span><input id="f_time_field" type="text" /></label>
            <label class="field"><span>time.mode</span><select id="f_time_mode"><option value="relative">relative</option><option value="absolute">absolute</option></select></label>
            <label class="field"><span>time.lastValue</span><input id="f_time_last_value" type="number" min="1" step="1" placeholder="30" /></label>
            <label class="field"><span>time.lastUnit</span><select id="f_time_last_unit"><option value="m">分钟</option><option value="h">小时</option><option value="d">天</option></select></label>
            <label class="field"><span>time.start</span><input id="f_time_start" type="text" placeholder="2026-03-05T00:00:00Z" /></label>
            <label class="field"><span>time.end</span><input id="f_time_end" type="text" placeholder="2026-03-05T00:30:00Z" /></label>
            <label class="field"><span>time.timezone（固定北京时间）</span><input id="f_time_timezone" type="text" value="Asia/Shanghai" readonly /></label>

            <label class="field"><span>groupBy.type</span><select id="f_group_type"><option value="none">none</option><option value="date_histogram">date_histogram</option><option value="terms">terms</option></select></label>
            <label class="field"><span>groupBy.field（terms可逗号分隔多字段）</span><input id="f_group_field" type="text" placeholder="service.keyword,host.keyword" /></label>
            <label class="field"><span>groupBy.interval</span><input id="f_group_interval" type="text" placeholder="5m" /></label>
            <label class="field"><span>groupBy.size</span><input id="f_group_size" type="number" min="1" max="1000" step="1" /></label>
            <label class="field"><span>groupBy.sort（按第一个metric降序排序）</span><input id="f_group_sort" type="checkbox" /></label>

            <label class="field"><span>chart.type</span><select id="f_chart_type"><option value="line">line</option><option value="bar">bar</option><option value="table">table</option></select></label>
            <label class="field"><span>chart.title</span><input id="f_chart_title" type="text" /></label>
            <label class="field"><span>chart.width</span><input id="f_chart_width" type="number" min="100" step="1" /></label>
            <label class="field"><span>chart.height</span><input id="f_chart_height" type="number" min="100" step="1" /></label>
            <label class="field"><span>chart.backgroundColor</span><input id="f_chart_bg" type="text" placeholder="#ffffff" /></label>
            <div class="field">
              <span>chart.colors（采色）</span>
              <div id="chartColorRows" class="color-rows"></div>
              <button id="addChartColorBtn" type="button" class="ghost">新增颜色</button>
            </div>
            <label class="field"><span>chart.optionPatchFile</span><input id="f_chart_patch_file" type="text" placeholder="./chart.json" /></label>

            <label class="field field-wide"><span>wecom.webhook</span><input id="f_wecom_webhook" type="text" /></label>
          </div>

          <div class="metrics-title-row">
            <div class="mode-title">metrics</div>
            <button id="addMetricBtn" type="button" class="ghost">新增 metric</button>
          </div>
          <div id="metricsRows" class="metrics-rows"></div>

          <div class="editor-actions split">
            <div class="left-actions">
              <button id="syncFromYamlBtn" type="button" class="ghost">YAML -> 表单</button>
              <button id="syncToYamlBtn" type="button" class="ghost">表单 -> YAML</button>
            </div>
          </div>

          <details class="raw-panel" open>
            <summary>原始文本编辑（高级）</summary>
            <div class="raw-grid">
              <label class="field">
                <span>monitor.yaml</span>
                <textarea id="monitorYaml" spellcheck="false"></textarea>
              </label>

              <label class="field">
                <span>query.json</span>
                <textarea id="queryJson" spellcheck="false"></textarea>
              </label>

              <label class="field">
                <span>chart.json</span>
                <textarea id="chartJson" spellcheck="false"></textarea>
              </label>

              <div class="editor-actions">
                <button id="saveRawBtn" type="button" class="primary">保存原始文本</button>
              </div>
            </div>
          </details>
        </section>
      </section>
    </main>

    <section id="floatingLogPanel" class="floating-log-panel minimized">
      <div id="floatingLogHeader" class="floating-log-header">
        <strong>运行日志</strong>
        <div class="actions">
          <button id="toggleLogsBtn" type="button" class="ghost">展开</button>
          <button id="refreshLogsBtn" type="button" class="ghost">刷新</button>
        </div>
      </div>
      <div id="runtimeLogs" class="runtime-logs"></div>
    </section>

    <script type="module" src="/app.js"></script>
  </body>
</html>
